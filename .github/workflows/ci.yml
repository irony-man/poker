name: CI

# Manual: Actions → CI → Run workflow
on:
  workflow_dispatch:
    inputs:
      playwright:
        description: Run the palette geometry Playwright job
        type: boolean
        default: false
      poker_e2e:
        description: Run the poker v2 Playwright job
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages + server
        run: |
          npm run build -w @poker/engine \
            -w @poker/ludo-engine \
            -w @poker/snakes-engine \
            -w @poker/memory-engine \
            -w @poker/courtpiece-engine \
            -w @poker/protocol \
            -w @poker/db \
            -w @poker/server

      - name: Build web
        env:
          NEXT_PUBLIC_SITE_URL: https://pokr.site
          NEXT_PUBLIC_API_URL: https://pokr.site
          NEXT_PUBLIC_WS_URL: wss://pokr.site/ws
          API_REWRITE_TARGET: http://server:4000
        run: npm run build -w @poker/web

      - name: Test
        run: npm test

  palette:
    name: Palette geometry
    if: inputs.playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Palette screenshots
        run: npm run test:palette -w @poker/web
        env:
          NEXT_PUBLIC_PALETTE_V2: '0'

  poker-e2e:
    name: Poker v2 screens
    if: inputs.poker_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Poker screens
        run: npm run test:e2e -w @poker/web
