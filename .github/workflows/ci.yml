name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel overlapping PR runs; never cancel main (would abort an in-flight deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages + server
        run: |
          npm run build -w @poker/engine \
            -w @poker/ludo-engine \
            -w @poker/snakes-engine \
            -w @poker/memory-engine \
            -w @poker/courtpiece-engine \
            -w @poker/protocol \
            -w @poker/db \
            -w @poker/server

      - name: Build web
        env:
          NEXT_PUBLIC_SITE_URL: https://pokr.site
          NEXT_PUBLIC_API_URL: https://pokr.site
          NEXT_PUBLIC_WS_URL: wss://pokr.site/ws
          API_REWRITE_TARGET: http://server:4000
        run: npm run build -w @poker/web

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
