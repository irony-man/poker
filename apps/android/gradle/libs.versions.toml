[versions]
agp = "8.11.2"
kotlin = "2.4.10"
ksp = "2.3.10"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
hilt = "2.58"
