# Dev stack for https://dev.pokr.site, run next to prod (pokr.site).
#   docker compose -p pokr-dev -f docker-compose.dev.yml up -d --build
# Own Postgres + Redis so dev never touches the prod database. Ports bind to 127.0.0.1;
# Caddy is the only public entry (dev.pokr.site → 3001 web, /ws → 4001 server).

services:
  postgres:
    # Same major as Supabase so scripts/db-sync.sh dumps restore cleanly.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    volumes:
      - dev-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      DATABASE_URL: postgres://poker:poker@postgres:5432/poker
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://dev.pokr.site,https://admin.dev.pokr.site
      PUBLIC_WEB_URL: https://dev.pokr.site
      INSTAGRAM_REDIRECT_URI: https://dev.pokr.site/auth/instagram/callback
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - dev-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://dev.pokr.site
        NEXT_PUBLIC_ADMIN_URL: https://admin.dev.pokr.site
        NEXT_PUBLIC_TASK_TRACKER_URL: ${NEXT_PUBLIC_TASK_TRACKER_URL:-}
        NEXT_PUBLIC_API_URL: https://dev.pokr.site
        NEXT_PUBLIC_WS_URL: wss://dev.pokr.site/ws
        API_REWRITE_TARGET: http://server:4000
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GA_ENABLE_IN_DEV: ${NEXT_PUBLIC_GA_ENABLE_IN_DEV:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_INSTAGRAM_ENABLED: ${NEXT_PUBLIC_INSTAGRAM_ENABLED:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_CONTACT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_JURISDICTION: ${NEXT_PUBLIC_LEGAL_JURISDICTION:-}
    environment:
      PORT: "3000"
      API_REWRITE_TARGET: http://server:4000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dev-pg:
  dev-redis:
  dev-data:
