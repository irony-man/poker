# Production Compose: Nest + Next. DB is external (Supabase) via DATABASE_URL in `.env`.
# Optional local Postgres: docker compose --profile local-db up -d postgres

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    volumes:
      - poker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Optional local Redis: npm run redis:up (docker compose --profile local-redis up -d redis)
  # Compose server → REDIS_URL=redis://redis:6379; host processes → redis://127.0.0.1:6379.
  # Prod: leave this profile off and set REDIS_URL to the managed provider's rediss:// URL.
  redis:
    profiles: ["local-redis"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - poker-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATA_DIR: /app/data
      # Required: Supabase Session pooler URI (IPv4). Do not use docker `postgres` hostname in prod.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Supabase pooler URL}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      SUPABASE_REGION: ${SUPABASE_REGION:-}
      REDIS_URL: ${REDIS_URL:-}
      # OpenAI-compatible hosted LLM. Unset → template banter; /chat unavailable.
      BANTER_LLM_BASE_URL: ${BANTER_LLM_BASE_URL:-}
      BANTER_LLM_API_KEY: ${BANTER_LLM_API_KEY:-}
      BANTER_LLM_MODEL: ${BANTER_LLM_MODEL:-}
      BANTER_LLM_PATH: ${BANTER_LLM_PATH:-/v1/chat/completions}
      BANTER_LLM_TIMEOUT_MS: ${BANTER_LLM_TIMEOUT_MS:-8000}
      BOT_CHAT_LLM_BASE_URL: ${BOT_CHAT_LLM_BASE_URL:-}
      BOT_CHAT_LLM_API_KEY: ${BOT_CHAT_LLM_API_KEY:-}
      BOT_CHAT_LLM_PATH: ${BOT_CHAT_LLM_PATH:-}
      BOT_CHAT_TIMEOUT_MS: ${BOT_CHAT_TIMEOUT_MS:-60000}
      BOT_CHAT_MODEL: ${BOT_CHAT_MODEL:-}
      # Google sign-in (OAuth web client id; web + Android verify against it).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-}
      # Recovery / password-reset email (SMTP). Unset SMTP_HOST → links are logged instead.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Blank → no rate-limit bypass. Set (same value as the loadtest service) only while load testing.
      LOADTEST_TOKEN: ${LOADTEST_TOKEN:-}
    volumes:
      - poker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # Load-test dashboard: docker compose --profile loadtest up -d --build loadtest  → http://<host>:4100
  # Set LOADTEST_TOKEN to the same value here and on the target server to bypass its rate limits.
  loadtest:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: apps/loadtest/Dockerfile
    ports:
      - "${LOADTEST_PORT:-4100}:4100"
    environment:
      # Required (≥12 chars); the service refuses to start without it.
      LOADTEST_ADMIN_TOKEN: ${LOADTEST_ADMIN_TOKEN:-}
      LOADTEST_TOKEN: ${LOADTEST_TOKEN:-}
      LOADTEST_TARGETS: ${LOADTEST_TARGETS:-local=http://server:4000|ws://server:4000/ws}
      LOADTEST_MAX_VUS: ${LOADTEST_MAX_VUS:-500}
      LOADTEST_COOKIE_SECURE: ${LOADTEST_COOKIE_SECURE:-false}
      REPORTS_DIR: /app/data
    volumes:
      - poker-loadtest:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pokr.site}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
        NEXT_PUBLIC_ASSETS_URL: ${NEXT_PUBLIC_ASSETS_URL:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        # Blank hides the Google / Instagram sign-in buttons.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_INSTAGRAM_ENABLED: ${NEXT_PUBLIC_INSTAGRAM_ENABLED:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_CONTACT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_JURISDICTION: ${NEXT_PUBLIC_LEGAL_JURISDICTION:-}
        # Must be Compose service URL at build time (not https://pokr.site) or /api rewrites loop.
        API_REWRITE_TARGET: ${API_REWRITE_TARGET:-http://server:4000}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      API_REWRITE_TARGET: ${API_REWRITE_TARGET:-http://server:4000}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poker-data:
  poker-pg:
  poker-redis:
  poker-loadtest:
