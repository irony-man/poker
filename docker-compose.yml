# Production Compose: Nest + Next. DB is external (Supabase) via DATABASE_URL in `.env`.
# Optional local Postgres: docker compose --profile local-db up -d postgres

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    volumes:
      - poker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATA_DIR: /app/data
      # Required: Supabase Session pooler URI (IPv4). Do not use docker `postgres` hostname in prod.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Supabase pooler URL}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      SUPABASE_REGION: ${SUPABASE_REGION:-}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - poker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pokr.site}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
        NEXT_PUBLIC_ASSETS_URL: ${NEXT_PUBLIC_ASSETS_URL:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        # Must be Compose service URL at build time (not https://pokr.site) or /api rewrites loop.
        API_REWRITE_TARGET: ${API_REWRITE_TARGET:-http://server:4000}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      API_REWRITE_TARGET: ${API_REWRITE_TARGET:-http://server:4000}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poker-data:
  poker-pg:
