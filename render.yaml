# Deploy via Render Blueprint: Dashboard → New → Blueprint
# Repo: https://github.com/irony-man/poker
#
# Free instances sleep after ~15 min idle (cold start ~1 min).
# WebSockets are supported: use wss:// for the game server.
#
# Public URLs:
#   web:    https://felt-web.onrender.com
#   server: https://felt-server-hgi4.onrender.com

services:
  - type: web
    name: felt-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build -w @poker/engine -w @poker/protocol -w @poker/db -w @poker/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: WEB_ORIGIN
        value: https://felt-web.onrender.com

  - type: web
    name: felt-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build -w @poker/engine -w @poker/protocol && npm run build -w @poker/web
    # Build output lives in apps/web/.next — start must run from that directory
    startCommand: cd apps/web && npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://felt-server-hgi4.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://felt-server-hgi4.onrender.com/ws
