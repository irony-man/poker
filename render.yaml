# Deploy via Render Blueprint: Dashboard → New → Blueprint
# Repo: https://github.com/irony-man/poker
#
# Free instances sleep after ~15 min idle (cold start ~1 min).
# WebSockets are supported: use wss:// for the game server.
#
# Public URLs:
#   web:    https://pokr.site (custom domain; Render: felt-web.onrender.com)
#   server: https://felt-server-hgi4.onrender.com

services:
  - type: web
    name: felt-server
    runtime: node
    plan: free
    region: oregon
    branch: main-08-08
    buildCommand: npm ci && npm run build -w @poker/engine -w @poker/protocol -w @poker/db -w @poker/server
    # Package start, with dist/index.js also present as alias for dashboard overrides.
    startCommand: npm run start -w @poker/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: WEB_ORIGIN
        value: https://pokr.site
      # Required. Prefer Supabase Session pooler URI (IPv4) if using Supabase —
      # direct db.<ref>.supabase.co is IPv6-only and fails on Render free.
      - key: DATABASE_URL
        sync: false
      # Optional override when auto-region detect fails (e.g. ap-southeast-1)
      - key: SUPABASE_REGION
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAMES
        value: shivam,slick
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

  - type: web
    name: felt-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev: typescript lives in devDependencies; production NODE_ENV would skip it
    buildCommand: npm ci --include=dev && npm run build:web
    # Build output lives in apps/web/.next — start must run from that directory
    startCommand: cd apps/web && npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://pokr.site
      - key: NEXT_PUBLIC_API_URL
        value: https://felt-server-hgi4.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://felt-server-hgi4.onrender.com/ws
      # Optional Search Console / Bing HTML verification tokens
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_BING_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_ASSETS_URL
        sync: false
